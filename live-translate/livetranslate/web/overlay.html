<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Translate</title>
<style>
  :root { --bg:#0b0d12; --fg:#f5f7fa; --muted:#9aa3b2; --accent:#4fd1c5; --panel:rgba(0,0,0,.55); }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family: "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif; }
  body.transparent { background:transparent; }
  #wrap { position:fixed; left:0; right:0; bottom:0; padding:16px 24px 28px; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .line { background:var(--panel); border-radius:12px; padding:10px 18px; max-width:min(1100px, 92vw); text-align:center; backdrop-filter: blur(6px); box-shadow: 0 2px 12px rgba(0,0,0,.35); }
  .line .src { color:var(--muted); font-size:var(--src-size, 20px); line-height:1.3; }
  .line .tr  { color:var(--fg); font-size:var(--tr-size, 32px); font-weight:600; line-height:1.3; text-shadow:0 2px 4px rgba(0,0,0,.7); }
  .line.old { opacity:.55; }
  .line.old .tr { font-size: calc(var(--tr-size, 32px) * .8); font-weight:500; }
  #status { position:fixed; top:8px; right:12px; font-size:12px; color:var(--muted); background:var(--panel); padding:4px 10px; border-radius:8px; }
  #status b { color:var(--accent); }
  body.hide-status #status { display:none; }
</style>
</head>
<body>
<div id="status">đang chờ...</div>
<div id="wrap"></div>
<script>
  // Tham số URL: ?bg=0 (nền trong suốt, cho OBS), ?n=2 (số dòng), ?src=0 (ẩn câu gốc), ?size=36 (cỡ chữ), ?status=0
  const q = new URLSearchParams(location.search);
  if (q.get('bg') === '0') document.body.classList.add('transparent');
  if (q.get('status') === '0') document.body.classList.add('hide-status');
  const N = parseInt(q.get('n') || '2', 10);
  const showSrc = q.get('src') !== '0';
  if (q.get('size')) document.documentElement.style.setProperty('--tr-size', q.get('size') + 'px');
  const wrap = document.getElementById('wrap');
  const status = document.getElementById('status');
  let lastKey = '';
  async function tick() {
    try {
      const r = await fetch('/api/state', {cache: 'no-store'});
      const data = await r.json();
      const lines = (data.lines || []).slice(-N);
      const key = lines.map(l => l.index + ':' + l.translation).join('|');
      if (key !== lastKey) {
        lastKey = key;
        wrap.innerHTML = '';
        lines.forEach((l, i) => {
          const d = document.createElement('div');
          d.className = 'line' + (i < lines.length - 1 ? ' old' : '');
          if (showSrc && l.source && l.source !== l.translation) {
            const s = document.createElement('div'); s.className = 'src'; s.textContent = l.source; d.appendChild(s);
          }
          const t = document.createElement('div'); t.className = 'tr'; t.textContent = l.translation; d.appendChild(t);
          wrap.appendChild(d);
        });
      }
      const st = data.status || {};
      status.innerHTML = `<b>${st.source || ''}</b> · ${st.stt || ''} → ${st.translator || ''} → ${st.tts || ''} · câu: ${st.lines ?? 0} · trễ: ${st.last_latency_ms ?? '-'} ms`;
    } catch (e) {
      status.textContent = 'mất kết nối tới livetranslate';
    }
  }
  setInterval(tick, 500); tick();
</script>
</body>
</html>
