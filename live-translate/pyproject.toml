[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livetranslate"
version = "0.1.0"
description = "Dịch trực tiếp YouTube / stream / mic sang tiếng Việt và đọc bằng giọng VieNeu-TTS. Cắm API Gemini hoặc bất kỳ AI nào."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "requests>=2.31",
]

[project.optional-dependencies]
# Nhận dạng giọng nói offline (CPU). Không cần nếu dùng --stt gemini / --stt openai
stt = ["faster-whisper>=1.0"]
# Giọng đọc tiếng Việt VieNeu-TTS (torch-free trên CPU)
tts = ["vieneu>=3.8"]
# Thu mic / phát loa
audio = ["sounddevice>=0.4.6"]
# Tải stream YouTube, Twitch, Facebook, TikTok... (cần ffmpeg trong PATH)
url = ["yt-dlp>=2024.1.1"]
# Client STT streaming tới server WhisperLiveKit (server cài riêng: pip install whisperlivekit)
wlk = ["websockets>=12"]
all = ["faster-whisper>=1.0", "vieneu>=3.8", "sounddevice>=0.4.6", "yt-dlp>=2024.1.1", "websockets>=12"]
dev = ["pytest>=7", "websockets>=12"]

[project.scripts]
livetranslate = "livetranslate.cli:main"

[tool.setuptools.packages.find]
include = ["livetranslate*"]

[tool.setuptools.package-data]
livetranslate = ["web/*.html"]
