name: live-translate tests

on:
  push:
    paths: ["live-translate/**", ".github/workflows/live-translate-tests.yml"]
  pull_request:
    paths: ["live-translate/**", ".github/workflows/live-translate-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: live-translate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
